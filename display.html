  html,body{height:100%}
  body{

2%20opacity%3D%220.05%22%20filter%3D%22url(%23b3)%22%2F%3E%3Ccircle%20cx%3D%22524%22%20cy%3D%22814%22%20r%3D%2212%22%20fill%3D%22%23CFEAFF%22%20opacity%3D%220.12%22%20filter%3D%22url(%23b3)%22%2F%3E%3Ccircle%20cx%3D%221155%22%20cy%3D%22250%22%20r%3D%2226%22%20fill%3D%22%23CFEAFF%22%20opacity%3D%220.05%22%20filter%3D%22url(%23b8)%22%2F%3E%3Ccircle%20cx%3D%22684%22%20cy%3D%22639%22%20r%3D%2238%22%20fill%3D%22%23CFEAFF%22%20opacity%3D%220.12%22%20filter%3D%22url(%23b8)%22%2F%3E%3Ccircle%20cx%3D%221348%22%20cy%3D%22355%22%20r%3D%2218%22%20fill%3D%22%23CFEAFF%22%20opacity%3D%220.16%22%20filter%3D%22url(%23b3)%22%2F%3E%3Ccircle%20cx%3D%22593%22%20cy%3D%221008%22%20r%3D%2226%22%20fill%3D%22%23CFEAFF%22%20opacity%3D%220.05%22%20filter%3D%22url(%23b8)%22%2F%3E%0A%3Crect%20width%3D%221920%22%20height%3D%221080%22%20fill%3D%22url(%23vg)%22%2F%3E%0A%3C%2Fsvg%3E") center/cover no-repeat;
  }
  .screen{
    height:100vh;display:grid;gap:1rem 1.3rem;padding:1.2rem 1.5rem 1rem;
    grid-template-columns:26% minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
  }

  /* ---------- 左:時計と写真 ---------- */
  .left{
    display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:1.2rem;
    background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(8,30,80,.34));
    -webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);
    box-shadow:0 .8rem 2.4rem rgba(0,10,40,.4);
  }
  .clock{padding:1rem 1.4rem .4rem;color:#fff;text-shadow:0 .1rem .9rem rgba(0,20,90,.55)}
  .time{font-size:5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
  .time .sec{font-size:2.2rem;margin-left:.5rem;font-weight:600;opacity:.9}
  .date{display:flex;align-items:center;gap:.6rem;margin-top:.7rem;font-size:1.7rem;font-weight:600}
  .date svg{width:1.8rem;height:1.8rem;flex:none}
  .photos{position:relative;flex:1;min-height:0;margin:.8rem 1.1rem 1.1rem;border-radius:.9rem;overflow:hidden;background:rgba(255,255,255,.1);box-shadow:0 .4rem 1.4rem rgba(0,10,50,.45)}
  .photos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s}
  .photos img.on{opacity:1}
  .photos .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;text-align:center;color:rgba(255,255,255,.75);font-size:1.8rem;font-weight:700}
  .dots{position:absolute;left:0;right:0;bottom:.7rem;display:flex;justify-content:center;gap:.5rem;z-index:2}
  .dots i{width:.7rem;height:.7rem;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 .3rem rgba(0,0,0,.3)}
  .dots i.on{background:#fff}

  /* ---------- 右:お知らせ(すりガラス風) ---------- */
  .right{display:flex;flex-direction:column;min-width:0;min-height:0;gap:.5rem}
  .list{flex:1;min-height:0;display:flex;flex-direction:column;gap:.75rem;overflow:hidden}
  .list.fadein{animation:fadein .6s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .probe{position:absolute;left:-99999px;top:0;visibility:hidden;display:flex;flex-direction:column}

  .card{
    --cat:#2B6CB0;--on:#fff;
    position:relative;flex:none;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(120deg,rgba(255,255,255,.8),rgba(255,255,255,.56));
    -webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);
    border-radius:1rem;padding:.7rem 1.4rem .75rem 1.9rem;
    box-shadow:0 .5rem 1.6rem rgba(0,15,60,.3);
  }
  /* 種類の色は、枠線ではなく内側の細いバーで示します */
  .card::before{content:"";position:absolute;left:.7rem;top:.75rem;bottom:.75rem;width:.4rem;border-radius:.4rem;background:var(--cat)}
  .card[data-cat="重要"]{--cat:#D6283E;background:linear-gradient(120deg,rgba(255,240,243,.86),rgba(246,150,170,.6))}
  .card[data-cat="注意"]{--cat:#F2A100;--on:#1B2A33}
  .card[data-cat="安全"]{--cat:#1E8E5A}
  .card[data-cat="一般"]{--cat:#2B6CB0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .card h2{font-size:2.1rem;line-height:1.3;font-weight:800;min-width:0;overflow-wrap:anywhere}
  .tag{display:inline-block;vertical-align:.18em;margin-right:.7rem;padding:0 .6rem;border-radius:.3rem;background:var(--cat);color:var(--on);font-size:1.1rem;font-weight:800;line-height:1.7}
  .body{margin-top:.15rem;font-size:1.5rem;line-height:1.5;color:#1D2D45;white-space:pre-wrap;overflow-wrap:anywhere}
  .chip{flex:none;display:flex;align-items:center;gap:.5rem;padding:.2rem .5rem .2rem .9rem;border-radius:2rem;background:rgba(255,255,255,.6);color:#0F3C8C;font-size:1.3rem;font-weight:700;white-space:nowrap}
  .chip svg{width:1.5rem;height:1.5rem}
  .chip .rest{padding:0 .8rem;border-radius:2rem;background:#0F3C8C;color:#fff}
  .chip .rest.today{background:#D6283E}
  .card.compact{padding:.45rem 1.4rem .45rem 1.9rem}
  .card.compact::before{top:.5rem;bottom:.5rem}
  .card.compact h2{font-size:1.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .card.compact .chip{font-size:1.15rem}

  .empty{
    flex:1;display:flex;align-items:center;justify-content:center;border-radius:1rem;
    background:linear-gradient(120deg,rgba(255,255,255,.7),rgba(255,255,255,.45));
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    font-size:3rem;font-weight:700;color:#1D2D45;
  }
  .legend{display:flex;justify-content:flex-end;align-items:center;gap:1.2rem;padding:0 .4rem;font-size:1.05rem;color:#E1EEFF;font-weight:600;text-shadow:0 .05rem .4rem rgba(0,15,60,.6)}
  .legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;margin-right:.4rem;vertical-align:-.05rem}
  .legend .warn{color:#FFD27A;margin-right:auto}

  /* ---------- 下:お役立ち情報(横に流れる) ---------- */
  .ticker{
    grid-column:1/-1;display:flex;align-items:center;gap:1.2rem;min-height:3.6rem;padding:.4rem 1.6rem;border-radius:3rem;color:#fff;
    background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(8,30,80,.4));
    -webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);
    box-shadow:0 .5rem 1.6rem rgba(0,10,40,.35);
  }
  .ticker[hidden]{display:none}
  .ticker svg{width:2.2rem;height:2.2rem;flex:none}
  .marquee{
    flex:1;min-width:0;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);
  }
  .track{display:inline-flex;white-space:nowrap;will-change:transform;animation:marquee 30s linear infinite}
  .grp{display:inline-flex;align-items:center;flex:none}
  .tip{font-size:1.7rem;font-weight:600;text-shadow:0 .05rem .5rem rgba(0,15,60,.5)}
  .sep{margin:0 2.4rem;font-size:1.1rem;color:#FFC83D}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.list.fadein{animation:none}.photos img{transition:none}}
</style>
</head>
<body>
<div class="screen">
  <aside class="left">
    <div class="clock">
      <div class="time" id="time"></div>
      <div class="date">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="date"></span>
      </div>
    </div>
    <div class="photos" id="photos"><div class="dots" id="dots"></div></div>
  </aside>

  <section class="right">
    <div class="list" id="list"></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="ticker" id="ticker" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="#FFC83D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="#FFC83D" fill-opacity=".25"/></svg>
    <div class="marquee" id="marquee"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';
  var SUPABASE_URL = 'https://qfndfbjohdhhhkbkqehd.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_zmUVerRR5Dk8N5YrPetgYw_RiYeU8in';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var DATA_FILE = 'posts.js';   // 旧ファイル方式との互換用
  var REFRESH_SEC = 30;         // データを読み直す間隔(秒)
  var CAT_ORDER = {'重要':0,'注意':1,'安全':2,'一般':3};
  var CAT_COLOR = {'重要':'#D6283E','注意':'#F2A100','安全':'#1E8E5A','一般':'#2B6CB0'};
  var WEEK = ['日','月','火','水','木','金','土'];
  var TIP_SPEED = {1:4.5, 2:6.5, 3:9};   // お役立ち情報が流れる速さ(1秒あたりの文字サイズ換算)
  var CAL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#0F3C8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

  var data = {settings:{},posts:[],tips:[],images:[]};
  var raw = {posts:'',tips:'',images:'',title:''};
  var spot = 0, imgIdx = 0, restCount = 0, lastDay = '', loadFailed = false, loadedOnce = false;

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n<10?'0':'')+n; }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseYmd(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }
  function daysUntil(s){ var d=parseYmd(s); if(!d) return null; return Math.round((d - parseYmd(today()))/86400000); }
  function el(tag, cls, text){
    var e=document.createElement(tag);
    if(cls) e.className=cls;
    if(text!==undefined) e.textContent=text;   // textContent なので、入力内容がHTMLとして実行されることはありません
    return e;
  }
  function setting(name, def, min){
    var v=parseInt((data.settings||{})[name],10);
    return (v && v>=min) ? v : def;
  }

  /* ---------- 時計 ---------- */
  function tick(){
    var d=new Date();
    $('time').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
    $('time').appendChild(el('span','sec',pad(d.getSeconds())));
    $('date').textContent=d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+WEEK[d.getDay()]+')';
    if(today()!==lastDay){ lastDay=today(); if(loadedOnce) layout(); }   // 日付が変わったら表示を更新
  }

  /* ---------- 表示するお知らせを選んで並べる ---------- */
  function visiblePosts(){
    var t=today();
    return data.posts.filter(function(p){
      if(!p || !p.title) return false;
      if(p.start && p.start>t) return false;
      if(p.end && p.end<t) return false;
      return true;
    }).sort(function(a,b){
      if(!!a.pinned!==!!b.pinned) return a.pinned?-1:1;
      var ca=CAT_ORDER[a.category], cb=CAT_ORDER[b.category];
      ca=ca===undefined?9:ca; cb=cb===undefined?9:cb;
      if(ca!==cb) return ca-cb;
      var ea=(a.eventDate && a.eventDate>=t)?a.eventDate:'9999', eb=(b.eventDate && b.eventDate>=t)?b.eventDate:'9999';
      if(ea!==eb) return ea<eb?-1:1;
      return (b.updated||'')<(a.updated||'')?-1:1;
    });
  }

  function buildChip(p){
    var d=parseYmd(p.eventDate);
    if(!d) return null;
    var n=daysUntil(p.eventDate);
    var chip=el('div','chip');
    var ic=el('span'); ic.innerHTML=CAL_SVG; chip.appendChild(ic.firstChild);
    chip.appendChild(el('span','', (d.getMonth()+1)+'月'+d.getDate()+'日('+WEEK[d.getDay()]+')'));
    if(n===0) chip.appendChild(el('span','rest today','本日'));
    else if(n>0) chip.appendChild(el('span','rest','あと'+n+'日'));
    return chip;
  }

  function buildCard(p, mode){
    var c=el('article','card '+(mode==='compact'?'compact':'full'));
    c.setAttribute('data-cat', p.category||'一般');
    var row=el('div','row');
    var h=el('h2');
    h.appendChild(el('span','tag',p.category||'一般'));
    h.appendChild(document.createTextNode(p.title));
    row.appendChild(h);
    var chip=buildChip(p);
    if(chip) row.appendChild(chip);
    c.appendChild(row);
    if(mode!=='compact' && p.body) c.appendChild(el('div','body',p.body));
    return c;
  }

  /* 画面に入りきるだけ詳しく表示し、入らない分(優先度が低いもの)はタイトルだけの行にします。
     タイトルだけの行は、一定時間ごとに1件ずつ内容が開いて順番に見せます。 */
  function layout(){
    var list=$('list'), posts=visiblePosts();
    renderLegend(posts);
    list.textContent='';
    restCount=0;
    if(!posts.length){ list.appendChild(el('div','empty','お知らせはありません')); return; }

    var H=list.clientHeight, W=list.clientWidth;
    var gap=parseFloat(getComputedStyle(list).rowGap)||10;
    var probe=el('div','probe'); probe.style.width=W+'px'; document.body.appendChild(probe);
    var hf=posts.map(function(p){ var c=buildCard(p,'full'); probe.appendChild(c); return Math.min(c.offsetHeight,H); });
    var cc=buildCard(posts[0],'compact'); probe.appendChild(cc);
    var hc=cc.offsetHeight;
    document.body.removeChild(probe);

    var n=posts.length, i, total=gap*(n-1);
    for(i=0;i<n;i++) total+=hf[i];
    var k=n;                                   // k = 詳しく表示する件数(優先度の高い順)
    if(total>H){
      for(k=n-1;k>=0;k--){
        var full=0, maxR=0;
        for(i=0;i<k;i++) full+=hf[i];
        for(i=k;i<n;i++) maxR=Math.max(maxR,hf[i]);
        if(full+maxR+(n-k-1)*hc+gap*(n-1)<=H) break;
      }
      if(k<0) k=0;
    }
    restCount=n-k;
    var spotIdx = restCount>0 ? k+(spot%restCount) : -1;
    posts.forEach(function(p,idx){
      var full=(idx<k || idx===spotIdx);
      var c=buildCard(p, full?'full':'compact');
      if(full) c.style.maxHeight=H+'px';
      list.appendChild(c);
    });
  }

  function renderLegend(posts){
    var lg=$('legend'); lg.textContent='';
    if(loadFailed) lg.appendChild(el('span','warn','最新の情報を読み込めません(前回の内容を表示中)'));
    if(!posts.length) return;
    Object.keys(CAT_ORDER).forEach(function(k){
      var cnt=posts.filter(function(p){ return (p.category||'一般')===k; }).length;
      var s=el('span');
      var dot=el('i'); dot.style.background=CAT_COLOR[k];
      s.appendChild(dot); s.appendChild(document.createTextNode(k+' '+cnt+'件'));
      lg.appendChild(s);
    });
  }

  /* ---------- 写真スライドショー ---------- */
  function renderPhotos(){
    var box=$('photos'), i;
    var old=box.querySelectorAll('img,.placeholder');
    for(i=0;i<old.length;i++) box.removeChild(old[i]);
    var dots=$('dots'); dots.textContent='';
    var imgs=data.images||[];
    if(!imgs.length){
      box.insertBefore(el('div','placeholder',(data.settings&&data.settings.title)||'社内お知らせ'), dots);
      return;
    }
    if(imgIdx>=imgs.length) imgIdx=0;
    imgs.forEach(function(im,idx){
      var e=document.createElement('img'); e.src=im.src; e.alt='';
      if(idx===imgIdx) e.className='on';
      box.insertBefore(e,dots);
      dots.appendChild(el('i', idx===imgIdx?'on':''));
    });
    if(imgs.length===1) dots.textContent='';
  }
  function nextPhoto(){
    var box=$('photos'), imgs=box.querySelectorAll('img'), dots=$('dots').children;
    if(imgs.length>1){
      imgs[imgIdx].className='';
      if(dots[imgIdx]) dots[imgIdx].className='';
      imgIdx=(imgIdx+1)%imgs.length;
      imgs[imgIdx].className='on';
      if(dots[imgIdx]) dots[imgIdx].className='on';
    }
    setTimeout(nextPhoto, setting('imageSeconds',8,3)*1000);
  }

  /* ---------- お役立ち情報(横に流れる) ---------- */
  function renderTicker(){
    var tips=(data.tips||[]).filter(function(t){ return t && t.text; });
    var tk=$('ticker'), box=$('marquee');
    tk.hidden = tips.length===0;
    box.textContent='';
    if(!tips.length) return;

    function makeGroup(rep){
      var g=el('div','grp');
      for(var r=0;r<rep;r++){
        tips.forEach(function(t){ g.appendChild(el('span','tip',t.text)); g.appendChild(el('span','sep','◆')); });
      }
      return g;
    }
    var track=el('div','track');
    var g=makeGroup(1);
    track.appendChild(g); box.appendChild(track);
    var w1=g.offsetWidth || 1;
    var rep=Math.max(1, Math.ceil(box.clientWidth / w1));   // 1周分が画面幅より短いときは繰り返して埋める
    if(rep>1){ track.textContent=''; g=makeGroup(rep); track.appendChild(g); }
    track.appendChild(g.cloneNode(true));                  // 同じものを続けて並べ、つなぎ目なく繰り返す
    var rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
    var speed=(TIP_SPEED[setting('tipSpeed',2,1)] || TIP_SPEED[2]) * rem;   // px/秒
    track.style.animationDuration=Math.max(5, g.offsetWidth/speed)+'s';
  }

  /* ---------- 内容の周期切り替え ---------- */
  function rotate(){
    if(restCount>0){
      spot++; layout();
      var l=$('list'); l.classList.remove('fadein'); void l.offsetWidth; l.classList.add('fadein');
    }
    setTimeout(rotate, setting('rotateSeconds',10,5)*1000);
  }

  /* ---------- データの読み込み ---------- */
  // fetch ではなく <script> で読み込むため、共有フォルダ上のファイルを直接開いた場合(file://)でも動きます
  function apply(){
    var d=window.BOARD_DATA||{};
    data={
      settings:d.settings||{},
      posts:Array.isArray(d.posts)?d.posts:[],
      tips:Array.isArray(d.tips)?d.tips:[],
      images:Array.isArray(d.images)?d.images:[]
    };
    var rp=JSON.stringify([data.settings,data.posts]), rt=JSON.stringify([data.tips,data.settings.tipSpeed]), ri=JSON.stringify(data.images);
    var imgChanged = ri!==raw.images || (data.settings.title||'')!==raw.title;
    var changed = rp!==raw.posts || rt!==raw.tips || !loadedOnce;
    raw={posts:rp,tips:rt,images:ri,title:data.settings.title||''};
    loadedOnce=true;
    if(imgChanged) renderPhotos();
    if(changed){ renderTicker(); layout(); }
  }

  async function loadData(){
    try{
      var result=await sb.from('board_data').select('data').eq('id',1).single();
      if(result.error) throw result.error;
      window.BOARD_DATA=result.data.data||{};
      loadFailed=false;
      apply(); renderLegend(visiblePosts());
    }catch(err){
      console.error('掲示板データを取得できません:',err);
      loadFailed=true;
      if(!loadedOnce){ loadedOnce=true; renderPhotos(); renderTicker(); layout(); }
      else renderLegend(visiblePosts());
    }
  }

  var rt;
  function relayout(){ renderTicker(); layout(); }
  window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(relayout,250); });
  window.addEventListener('load', function(){ setTimeout(relayout,400); });

  tick(); setInterval(tick,1000);
  loadData(); setInterval(loadData, REFRESH_SEC*1000);
  setTimeout(nextPhoto, 8000);
  setTimeout(rotate, 10000);
})();
</script>
</body>
</html>
